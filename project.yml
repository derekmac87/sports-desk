name: SportsDesk
options:
  bundleIdPrefix: com.sportsdesk
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  SportsDeskCore:
    path: .
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  SportsDesk:
    type: application
    platform: iOS
    sources:
      - path: Apps/SportsDesk
        excludes:
          - Resources/Info-tvOS.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sportsdesk.SportsDesk
      PRODUCT_NAME: SportsDesk
      INFOPLIST_FILE: Apps/SportsDesk/Resources/Info-iOS.plist
      CODE_SIGN_ENTITLEMENTS: Apps/SportsDesk/Resources/SportsDesk.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      IPHONEOS_DEPLOYMENT_TARGET: 17.0
    dependencies:
      - package: SportsDeskCore
        product: SportsDeskCore
    entitlements:
      path: Apps/SportsDesk/Resources/SportsDesk.entitlements
  SportsDeskTV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/SportsDesk
        excludes:
          - Resources/Info-iOS.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sportsdesk.SportsDesk.tvos
      PRODUCT_NAME: SportsDeskTV
      INFOPLIST_FILE: Apps/SportsDesk/Resources/Info-tvOS.plist
      CODE_SIGN_ENTITLEMENTS: Apps/SportsDesk/Resources/SportsDesk.entitlements
      TARGETED_DEVICE_FAMILY: "3"
      ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      TVOS_DEPLOYMENT_TARGET: 17.0
    dependencies:
      - package: SportsDeskCore
        product: SportsDeskCore
    entitlements:
      path: Apps/SportsDesk/Resources/SportsDesk.entitlements
schemes:
  SportsDesk:
    build:
      targets:
        SportsDesk: all
    run:
      config: Debug
  SportsDeskTV:
    build:
      targets:
        SportsDeskTV: all
    run:
      config: Debug
